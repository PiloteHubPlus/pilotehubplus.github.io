<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0F223D" />
      <stop offset="70%" stop-color="#071426" />
      <stop offset="100%" stop-color="#040B16" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7BE" />
      <stop offset="30%" stop-color="#DFBA5E" />
      <stop offset="60%" stop-color="#C9A84C" />
      <stop offset="90%" stop-color="#9A7B2C" />
      <stop offset="100%" stop-color="#E2C675" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="50%" stop-color="#DFBA5E" />
      <stop offset="100%" stop-color="#B89339" />
    </linearGradient>

    <!-- Platinum/Silver Gradient for PH and PILOTE -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F0F4F8" />
      <stop offset="70%" stop-color="#C8D3E0" />
      <stop offset="100%" stop-color="#E6ECF2" />
    </linearGradient>

    <!-- Shield Inner Fill -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C1E36" />
      <stop offset="100%" stop-color="#061222" />
    </linearGradient>

    <!-- Book Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#D8E2EC" />
      <stop offset="100%" stop-color="#A6B8C7" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#DFBA5E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Midnight Background Canvas -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)" />

  <g filter="url(#shadow)">
    <!-- Laurel Wreath (Left Side) -->
    <g fill="url(#goldGrad)" opacity="0.95">
      <!-- Outer curved leaves -->
      <path d="M 125,145 C 105,175 100,215 108,255 C 114,285 130,315 155,338 C 158,333 155,326 150,320 C 130,298 118,272 114,245 C 110,210 115,178 132,150 Z" />
      <!-- Leaf Pairs Left -->
      <path d="M 120,135 C 105,142 98,160 108,172 C 115,165 125,150 120,135 Z" />
      <path d="M 108,170 C 92,180 86,200 98,212 C 105,203 114,188 108,170 Z" />
      <path d="M 100,212 C 84,225 80,246 92,258 C 99,248 107,232 100,212 Z" />
      <path d="M 102,255 C 88,270 88,292 100,302 C 106,290 112,274 102,255 Z" />
      <path d="M 115,295 C 104,312 108,334 122,342 C 126,328 128,312 115,295 Z" />
      <path d="M 138,332 C 130,350 138,370 154,374 C 156,360 154,345 138,332 Z" />
      <path d="M 168,362 C 162,378 174,396 190,396 C 190,382 184,370 168,362 Z" />
    </g>

    <!-- Laurel Wreath (Right Side) -->
    <g fill="url(#goldGrad)" opacity="0.95">
      <!-- Outer curved leaves -->
      <path d="M 375,145 C 395,175 400,215 392,255 C 386,285 370,315 345,338 C 342,333 345,326 350,320 C 370,298 382,272 386,245 C 390,210 385,178 368,150 Z" />
      <!-- Leaf Pairs Right -->
      <path d="M 380,135 C 395,142 402,160 392,172 C 385,165 375,150 380,135 Z" />
      <path d="M 392,170 C 408,180 414,200 402,212 C 395,203 386,188 392,170 Z" />
      <path d="M 400,212 C 416,225 420,246 408,258 C 401,248 393,232 400,212 Z" />
      <path d="M 398,255 C 412,270 412,292 400,302 C 394,290 388,274 398,255 Z" />
      <path d="M 385,295 C 396,312 392,334 378,342 C 374,328 372,312 385,295 Z" />
      <path d="M 362,332 C 370,350 362,370 346,374 C 344,360 346,345 362,332 Z" />
      <path d="M 332,362 C 338,378 326,396 310,396 C 310,382 316,370 332,362 Z" />
    </g>

    <!-- Heraldic Outer Shield Contour -->
    <path d="M 250,68 
             L 345,96 
             C 345,190 340,265 250,320 
             C 160,265 155,190 155,96 
             Z" 
          fill="url(#shieldBg)" 
          stroke="url(#goldGrad)" 
          stroke-width="5.5" 
          stroke-linejoin="round" />

    <!-- Heraldic Inner Shield Border -->
    <path d="M 250,82 
             L 332,106 
             C 332,185 328,252 250,302 
             C 172,252 168,185 168,106 
             Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="2" 
          opacity="0.85" />

    <!-- "PH" Large Serif Monogram -->
    <!-- Letter P -->
    <path d="M 192,130 L 222,130 C 238,130 248,137 248,152 C 248,167 238,175 222,175 L 208,175 L 208,200 L 192,200 Z 
             M 208,144 L 208,161 L 220,161 C 228,161 232,158 232,152 C 232,146 228,144 220,144 Z" 
          fill="url(#silverGrad)" 
          filter="url(#glow)" />
    
    <!-- Letter H -->
    <path d="M 258,130 L 274,130 L 274,159 L 298,159 L 298,130 L 314,130 L 314,200 L 298,200 L 298,174 L 274,174 L 274,200 L 258,200 Z" 
          fill="url(#silverGrad)" 
          filter="url(#glow)" />

    <!-- Superscript Gold Plus "+" -->
    <path d="M 324,124 L 328,124 L 328,118 L 332,118 L 332,124 L 336,124 L 336,128 L 332,128 L 332,134 L 328,134 L 328,128 L 324,128 Z" 
          fill="url(#goldLight)" />

    <!-- Twin Olive/Laurel Sprigs below PH -->
    <g fill="url(#goldGrad)">
      <path d="M 250,214 C 236,206 215,208 200,218 C 214,222 232,220 250,214 Z" />
      <path d="M 250,214 C 264,206 285,208 300,218 C 286,222 268,220 250,214 Z" />
      <circle cx="218" cy="210" r="2.5" />
      <circle cx="234" cy="207" r="2.5" />
      <circle cx="266" cy="207" r="2.5" />
      <circle cx="282" cy="210" r="2.5" />
    </g>

    <!-- Open Book In Middle Of Shield -->
    <!-- Book Base / Binding -->
    <path d="M 250,280 L 200,268 C 196,267 195,272 198,274 L 250,290 L 302,274 C 305,272 304,267 300,268 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Left Page Group -->
    <path d="M 250,242 C 230,234 205,236 195,242 L 195,268 C 205,262 230,260 250,268 Z" 
          fill="url(#pageGrad)" 
          stroke="#0A1628" 
          stroke-width="1" />
    
    <!-- Right Page Group -->
    <path d="M 250,242 C 270,234 295,236 305,242 L 305,268 C 295,262 270,260 250,268 Z" 
          fill="url(#pageGrad)" 
          stroke="#0A1628" 
          stroke-width="1" />
          
    <!-- Page Center Seam & Lines -->
    <line x1="250" y1="240" x2="250" y2="288" stroke="url(#goldGrad)" stroke-width="2" />
  </g>

  <!-- Typography Below Shield -->
  <!-- "PILOTE" (Platinum) & "HUB+" (Gold) -->
  <g text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="800" font-size="34" letter-spacing="4">
    <!-- "PILOTE" -->
    <text x="180" y="372" fill="url(#silverGrad)" filter="url(#glow)">PILOTE</text>
    <!-- "HUB+" -->
    <text x="325" y="372" fill="url(#goldGrad)" filter="url(#glow)">HUB+</text>
  </g>

  <!-- Diamond Separator Rule -->
  <g>
    <line x1="120" y1="395" x2="238" y2="395" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8" />
    <!-- Diamond -->
    <polygon points="250,391 254,395 250,399 246,395" fill="url(#goldLight)" />
    <line x1="262" y1="395" x2="380" y2="395" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8" />
  </g>

  <!-- Subtitle Motto: "REACH HIGHER. ACHIEVE MORE." -->
  <text x="250" y="420" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Playfair Display', Georgia, serif" 
        font-size="11.5" 
        font-weight="700" 
        letter-spacing="4" 
        fill="url(#goldGrad)">
    REACH HIGHER. ACHIEVE MORE.
  </text>
</svg>
